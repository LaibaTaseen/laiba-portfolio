<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Laiba Taseen — AI Engineer Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B0F19;
    --paper: #FAFAFA;
    --blue: #2F5EFF;
    --slate: #6B7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    max-width: 480px;
    text-align: left;
  }
  .kicker {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue);
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .dot {
    width: 9px;
    height: 9px;
    background: var(--blue);
    border-radius: 2px;
    display: inline-block;
  }
  p {
    font-size: 17px;
    color: var(--slate);
    line-height: 1.55;
    margin: 0;
  }
  @media (max-width: 480px) {
    h1 { font-size: 34px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Portfolio</div>
    <h1>Laiba Taseen<span class="dot"></span></h1>
    <p>Aspiring AI Engineer. Building practical AI and Machine Learning projects that solve real-world problems. Full portfolio coming soon.</p>
  </div>
</body>
</html>
